# docker-compose.yml — simple deployment for proxyd.
#
# proxyd transparently filters DNS + HTTP/HTTPS for a network. The host's
# firewall (nftables) must redirect TCP/80 and TCP/443 to the proxy and DNS
# clients must use the host as their resolver. proxyd deliberately does NOT
# modify the host firewall itself:
#
#   sudo deploy/nftables-setup.sh
#
# Quick start:
#   1. Edit deploy/docker/config.yaml (set dns.intercept_ipv4 to your host IP).
#   2. Edit deploy/docker/blocklist.txt.
#   3. docker compose up -d --build
#   4. sudo deploy/nftables-setup.sh
#
# Logs:    docker compose logs -f
# Reload:  docker compose kill -s HUP proxyd
# Stop:    docker compose down
# Rollback firewall: sudo deploy/nftables-teardown.sh

services:
  proxyd:
    build:
      context: .
      args:
        VERSION: "0.1.0"
    image: proxyd:latest
    container_name: proxyd
    init: true
    restart: unless-stopped

    # Share the host network namespace so firewall redirects and SO_MARK
    # bypass behave exactly as in a native install. Do not publish ports here.
    network_mode: host

    # Root inside the container binds the privileged DNS port and sets SO_MARK.
    # NET_BIND_SERVICE is in Docker's default set; NET_ADMIN is required for
    # limits.upstream_mark. Remove NET_ADMIN (and set upstream_mark: 0) if you
    # use a resolver- or UID-based loop-prevention instead.
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN

    volumes:
      # Config + blocklist (read by proxyd). Editing the blocklist is live via
      # SIGHUP; config changes need a restart.
      - ./deploy/docker:/etc/proxyd
      # Persist the root CA and leaf cache across restarts/upgrades.
      - proxyd-data:/var/lib/proxyd

volumes:
  proxyd-data:
