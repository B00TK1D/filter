# docker-compose.yml — self-contained deployment for proxyd.
#
# proxyd transparently filters DNS + HTTP/HTTPS for a network. The container
# installs the host interception rules itself, so no host scripts are needed:
# with host networking it shares the host network namespace and, holding
# CAP_NET_ADMIN, redirects TCP/80 and TCP/443 to its own listeners with
# nftables.
#
# Quick start:
#   1. Edit deploy/docker/config.yaml (set dns.intercept_ipv4 to your host IP).
#   2. Edit deploy/docker/blocklist.txt.
#   3. docker compose up -d --build
#
# Logs:    docker compose logs -f
# Reload:  docker compose kill -s HUP proxyd
# Stop:    docker compose down      (removes the firewall rules again)
#
# The rules are removed automatically when the container stops (SIGTERM). A
# hard `docker kill` (SIGKILL) skips cleanup; clean up stale tables with:
#   docker run --rm --network host --cap-add NET_ADMIN \
#     --entrypoint bash proxyd:latest /usr/local/lib/proxyd/nftables-teardown.sh

services:
  proxyd:
    build:
      context: .
      args:
        VERSION: "0.1.0"
    image: proxyd:latest
    container_name: proxyd
    init: true
    restart: unless-stopped

    # Share the host network namespace so the interception redirects and the
    # SO_MARK bypass apply to the host, exactly as in a native install.
    network_mode: host

    # NET_ADMIN: install nftables redirect/block rules on the host and set
    # SO_MARK for loop prevention. NET_BIND_SERVICE: bind the privileged DNS
    # port :53 (also in Docker's default set). The entrypoint runs as root
    # inside the container.
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE

    environment:
      # Keep these in sync with http.listen / https.listen / limits.upstream_mark
      # and udp443.mode in deploy/docker/config.yaml.
      FIREWALL: "1"          # 0 disables host firewall management
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      MARK: "1"
      BLOCK_DOT: "yes"       # block outbound DoT (TCP/UDP 853)
      UDP443_MODE: "reject"  # reject client UDP/443 so QUIC falls back to TCP
      # BYPASS_UID: "proxyd"

    volumes:
      # Config + blocklist. Blocklist edits are live via SIGHUP; config changes
      # need a restart.
      - ./deploy/docker:/etc/proxyd
      # Persist the root CA and leaf cache across restarts/upgrades.
      - proxyd-data:/var/lib/proxyd

    # Give proxyd time to shut down and remove the firewall rules cleanly.
    stop_grace_period: 30s

volumes:
  proxyd-data:
